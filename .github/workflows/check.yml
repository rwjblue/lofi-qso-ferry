name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: mise run setup
      - run: mise run check
